name: Build APK Auto
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Create Android Project
        run: |
          mkdir -p app/src/main/java/com/example/videotomacrodroid
          printf '%s\n' '<?xml version="1.0" encoding="utf-8"?><manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.example.videotomacrodroid"><application android:allowBackup="true" android:label="Video to MacroDroid"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>' > app/src/main/AndroidManifest.xml
          echo 'plugins { id "com.android.application" }' > app/build.gradle
          echo 'android { namespace "com.example.videotomacrodroid"; compileSdk 34; defaultConfig { applicationId "com.example.videotomacrodroid"; minSdk 21; targetSdk 34; versionCode 1; versionName "1.0" } }' >> app/build.gradle
          echo "plugins { id 'com.android.application' version '8.1.4' apply false }" > build.gradle
          echo "include ':app'" > settings.gradle
          echo "org.gradle.jvmargs=-Xmx2048m" > gradle.properties
          echo "android.useAndroidX=true" >> gradle.properties
          cat > app/src/main/java/com/example/videotomacrodroid/MainActivity.kt << 'KT'
          package com.example.videotomacrodroid
          import android.app.Activity
          import android.content.Intent
          import android.net.Uri
          import android.os.Bundle
          import android.widget.*
          class MainActivity : Activity() {
              private var videoUri: Uri? = null
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val layout = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setPadding(40,80,40,40) }
                  val btnPick = Button(this).apply { text = "1. Pick Video"; setOnClickListener { val i = Intent(Intent.ACTION_GET_CONTENT).apply { type = "video/*" }; startActivityForResult(Intent.createChooser(i,"Select"),1001) } }
                  val btnSend = Button(this).apply { text = "2. Send to MacroDroid"; setOnClickListener { val si = Intent("com.example.SEND_VIDEO").apply { setDataAndType(videoUri,"video/*"); addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION) }; sendBroadcast(si); Toast.makeText(this@MainActivity,"Sent!",0).show() } }
                  layout.addView(btnPick); layout.addView(btnSend); setContentView(layout)
              }
              override fun onActivityResult(rc:Int, rc2:Int, d:Intent?) { super.onActivityResult(rc,rc2,d); if(rc==1001 && rc2==RESULT_OK) videoUri=d?.data }
          }
          KT

      - name: Build APK
        run: |
          curl -s https://services.gradle.org/distributions/gradle-8.4-bin.zip -o gradle.zip
          unzip -q gradle.zip
          ./gradle-8.4/bin/gradle wrapper --gradle-version 8.4
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VideoToMacroDroid-APK-Fixed
          path: app/build/outputs/apk/debug/app-debug.apk
