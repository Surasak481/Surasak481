name: Build APK Auto
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Create project
        run: |
          mkdir -p app/src/main/java/com/example/videotomacrodroid
          echo  | base64 -d > app/src/main/AndroidManifest.xml
          echo  | base64 -d > app/build.gradle
          echo Ly8gZW1wdHkgcm9vdAo= | base64 -d > build.gradle
          echo  | base64 -d > settings.gradle
          echo b3JnLmdyYWRsZS5qdm1hcmdzPS1YbXgyMDQ4bQphbmRyb2lkLnVzZUFuZHJvaWRYPXRydWUK | base64 -d > gradle.properties
          echo  | base64 -d > app/src/main/java/com/example/videotomacrodroid/MainActivity.kt
          cat settings.gradle
          cat app/build.gradle
      - name: Build APK
        run: |
          curl -L -s https://services.gradle.org/distributions/gradle-8.4-bin.zip -o gradle.zip
          unzip -q gradle.zip
          ./gradle-8.4/bin/gradle wrapper --gradle-version 8.4
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VideoToMacroDroid-APK
          path: app/build/outputs/apk/debug/app-debug.apk
