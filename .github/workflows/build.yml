name: Build APK Auto

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Create Android Project
        run: |
          mkdir -p app/src/main/java/com/example/videotomacrodroid
          mkdir -p app/src/main
          
          cat > app/src/main/AndroidManifest.xml << 'MANIFEST'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.example.videotomacrodroid">
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO"/>
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>
              <application android:allowBackup="true" android:label="Video to MacroDroid" android:theme="@android:style/Theme.Material.Light">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          MANIFEST

          cat > app/build.gradle << 'APPGRADLE'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.example.videotomacrodroid'
              compileSdk 34
              defaultConfig {
                  applicationId "com.example.videotomacrodroid"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          APPGRADLE

          cat > build.gradle << 'ROOTGRADLE'
          plugins {
              id 'com.android.application' version '8.1.4' apply false
          }
          task clean(type: Delete) {
              delete rootProject.buildDir
          }
          ROOTGRADLE

          cat > settings.gradle << 'SETTINGS'
          include ':app'
          SETTINGS

          cat > app/src/main/java/com/example/videotomacrodroid/MainActivity.kt << 'KOTLIN'
          package com.example.videotomacrodroid
          import android.app.Activity
          import android.content.Intent
          import android.net.Uri
          import android.os.Bundle
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView
          import android.widget.Toast

          class MainActivity : Activity() {
              private var videoUri: Uri? = null
              private val PICK_VIDEO = 1001
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val layout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(40, 80, 40, 40)
                  }
                  val title = TextView(this).apply {
                      text = "Video to MacroDroid\nNo White Screen"
                      textSize = 20f
                      setPadding(0,0,0,40)
                  }
                  val status = TextView(this).apply {
                      text = "Ready - Tap Pick Video"
                      textSize = 16f
                      setPadding(0,0,0,20)
                  }
                  val btnPick = Button(this).apply {
                      text = "1. Pick Video File"
                      setOnClickListener {
                          val intent = Intent(Intent.ACTION_GET_CONTENT).apply { type = "video/*" }
                          startActivityForResult(Intent.createChooser(intent, "Select Video"), PICK_VIDEO)
                      }
                  }
                  val btnSend = Button(this).apply {
                      text = "2. Send to MacroDroid"
                      setOnClickListener {
                          if (videoUri == null) {
                              Toast.makeText(this@MainActivity, "Pick video first", Toast.LENGTH_SHORT).show()
                              return@setOnClickListener
                          }
                          val sendIntent = Intent("com.example.SEND_VIDEO").apply {
                              setDataAndType(videoUri, "video/*")
                              addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
                              putExtra("video_path", videoUri.toString())
                          }
                          sendBroadcast(sendIntent)
                          status.text = "Sent to MacroDroid!\n${videoUri}"
                          Toast.makeText(this@MainActivity, "Sent!", Toast.LENGTH_SHORT).show()
                      }
                  }
                  layout.addView(title)
                  layout.addView(status)
                  layout.addView(btnPick)
                  layout.addView(btnSend)
                  setContentView(layout)
              }
              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode == PICK_VIDEO && resultCode == RESULT_OK) {
                      videoUri = data?.data
                  }
              }
          }
          KOTLIN

          cat > gradle.properties << 'PROPS'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          PROPS

      - name: Setup Gradle Wrapper
        run: |
          curl -s https://services.gradle.org/distributions/gradle-8.4-bin.zip -o gradle.zip
          unzip -q gradle.zip
          ./gradle-8.4/bin/gradle wrapper --gradle-version 8.4

      - name: Build APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VideoToMacroDroid-APK-Fixed
          path: app/build/outputs/apk/debug/app-debug.apk
